<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100" height="100">
  <defs>
    <linearGradient id="minGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ff7a00" />
      <stop offset="100%" stop-color="#22c55e" />
    </linearGradient>
  </defs>
  
  <!-- Minimal Dark Rounded Square -->
  <rect x="0" y="0" width="100" height="100" rx="24" fill="#0f172a" />
  
  <!-- Minimalist Geometric Ring Stroke (C for Calori) -->
  <circle 
    cx="50" 
    cy="50" 
    r="28" 
    fill="none" 
    stroke="url(#minGrad)" 
    stroke-width="12" 
    stroke-linecap="round"
    stroke-dasharray="140 40"
  />

  <!-- Minimal Center Flame Dot -->
  <circle cx="50" cy="50" r="7" fill="#ff7a00" />
</svg>
